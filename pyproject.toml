[project]
name = "jex"
version = "0.1.0"
description = "A Jev-style System One decision model built from an existing LLM: typed questions, one prefill-only pass, calibrated probabilities, async serving."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0,<6",
    "datasets>=3.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]
gpu = ["bitsandbytes>=0.43", "accelerate>=0.30"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
